[package]
name        = "qoi-nv"
version     = "0.1.0"
description = "The Quite OK Image format, whole: the fourteen-byte header, all six opcodes and the sixty-four-entry running array, decoded by a feed-and-drain state machine the host pumps or in one call over a buffer, and encoded into a buffer the caller supplies at a size this package can tell them exactly."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: the decoder takes bytes the caller already holds and the
# encoder writes into a buffer the caller supplies.  No function declares
# an effect.
#
# There is no `tests/embedded_probe.nv`: the pixel type is color-nv's
# `Srgba8`, a plain struct, which a build for a microcontroller with no
# heap refuses to construct.
layer       = "core"

category    = "graphics"

tags        = ["qoi", "image", "codec", "lossless", "sans-io", "encoder", "decoder", "rgba"]
repository  = "https://github.com/novolang/qoi-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.14.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The whole of QOI, encoded and decoded without performing anything"

[dependencies]
# The pixel type is color-nv's `Srgba8`, which png-nv, svg-nv and
# image-nv speak too.
color-nv = "^0.1.1"
